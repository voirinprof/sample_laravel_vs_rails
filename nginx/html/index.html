<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Laravel vs Rails</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 80px auto; text-align: center; }
        .choices { display: flex; gap: 20px; justify-content: center; margin-top: 40px; }
        a.card { display: block; width: 200px; padding: 30px 20px; border-radius: 8px; text-decoration: none; color: white; font-size: 20px; font-weight: bold; }
        a.laravel { background: #ff2d20; }
        a.rails { background: #cc0000; }
        a.card:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <h1>📚 Laravel vs Rails</h1>
    <p>Choisis lequel visiter :</p>
    <div class="choices">
        <a class="card laravel" href="/laravel/">Laravel</a>
        <a class="card rails" href="/rails/">Rails</a>
    </div>
</body>
</html>
